[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "0.1.0"
description = "A Python maze generator featuring custom logo embedding."
readme = "MAZEGEN.md"
requires-python = ">=3.10"
authors = [
    { name = "pride-ol" },
    { name = "varaniba" }
]
dependencies = []
license = { file = "LICENSE.md" }

[tool.setuptools.packages.find]
include = ["mazegen*"]